<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP</title>
</head>
<body>
<form id="otp-form">
  <label for="otp">Enter the code sent to your email:</label>
  <input type="text" id="otp" maxlength="6" inputmode="numeric" required>
  <button type="submit">Verify</button>
</form>
<p>Didn't get a code? <a href="#" id="resend-link">Resend it</a></p>

<script>
  document.getElementById("otp-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = sessionStorage.getItem("pendingEmail");
    const otp = document.getElementById("otp").value.trim();

    const res = await fetch("/verify-otp", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, otp })
    });

    const result = await res.json();
    if (result.success) {
      sessionStorage.removeItem("pendingEmail");
      window.location.href = "/signin.html";
    } else {
      alert(result.message);
    }
  });

  document.getElementById("resend-link").addEventListener("click", async (e) => {
    e.preventDefault();
    const email = sessionStorage.getItem("pendingEmail");

    const res = await fetch("/resend-otp", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email })
    });

    const result = await res.json();
    alert(result.message);
});
</script>
</body>
</html>
