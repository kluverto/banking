<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin - User Details</title>\r\n  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin_users_details.css">\r\n  <link rel="stylesheet" href="i18n.css">\r\n  <style>
    form { max-width: 400px; margin: 20px auto; display: flex; flex-direction: column; gap: 10px; }
    input { padding: 8px; }
    button { padding: 10px; cursor: pointer; }
  </style>
</head>

<!-- Header -->
  <header>
    <section class="nav-bar">
      <div class="hero-image">
        <img src="images/Apextrust.png" alt="ApexTrust Bank" width="200" height="200">
      </div>
      <div class="nav">
        <ul>
          <li><a href="admin.html" data-i18n="nav.dashboard">Dashboard</a></li>
          <li><a href="manage_users.html" class="active" data-i18n="nav.users">Users</a></li>
          <li><a href="transactions.html" data-i18n="nav.transactions">Transactions</a></li>
          <li><a href="reports.html" data-i18n="nav.reports">Reports</a></li>
          <li><a href="settings.html" data-i18n="nav.settings">Settings</a></li>
          <li class="logout"><a href="signin.html" data-i18n="nav.logout">Logout</a></li>
        </ul>
        <div class="language-switcher">
          <label for="language-select" class="sr-only">Language</label>
          <select id="language-select" aria-label="Select language"></select>
        </div>
      </div>
    </section>
  </header>

<body>
  <h1 data-i18n="adminUserDetails.pageHeading">User Details</h1>
  <form id="userForm">
    <input type="text" name="firstname" placeholder="First Name" data-i18n-placeholder="adminUserDetails.firstName">
    <input type="text" name="secondname" placeholder="Second Name" data-i18n-placeholder="adminUserDetails.secondName">
    <input type="text" name="phonenumber" placeholder="Phone Number" data-i18n-placeholder="adminUserDetails.phoneNumber">
    <input type="date" name="date_of_birth" placeholder="Date of Birth" data-i18n-placeholder="adminUserDetails.dob">
    <input type="text" name="account_number" placeholder="Account Number" readonly data-i18n-placeholder="adminUserDetails.accountNumber">
    <input type="number" name="account_balance" placeholder="Account Balance" data-i18n-placeholder="adminUserDetails.accountBalance">
    <input type="number" name="savings_balance" placeholder="Savings Balance" data-i18n-placeholder="adminUserDetails.savingsBalance">
    <input type="number" name="card_balance" placeholder="Card Balance" data-i18n-placeholder="adminUserDetails.cardBalance">
    <button type="submit" data-i18n="adminUserDetails.updateUserButton">Update User</button>
  </form>

  <!-- Footer -->
  <footer>
      <div class="footer-container">
          <h4 data-i18n="common.contactUs">Contact Us</h4>
          <p><span data-i18n="common.email">Email:</span> <a href="mailto:apextrust@support.com">apextrust@support.com</a></p>
          <p data-i18n="common.copyright">© 2026 ApexTrust Bank. All rights reserved.</p>
          <nav>
              <ul>
                  <li><a href="" data-i18n="common.privacyPolicy">Privacy Policy</a></li>
                  <li><a href="" data-i18n="common.termsOfService">Terms of Service</a></li>
                  <li><a href="" data-i18n="common.contactLink">Contact Us</a></li>
              </ul>
          </nav>
      </div>
      <div class="social-media">
          <a href="facebook"><i class="fa-brands fa-facebook"></i></a>
          <a href="twitter"><i class="fa-brands fa-twitter"></i></a>
          <a href="instagram"><i class="fa-brands fa-instagram"></i></a>
          <a href="whatsapp"><i class="fa-brands fa-whatsapp"></i></a>
      </div>    
  </footer>

  <script src="translation.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const accountNumber = params.get("account");

    if (!accountNumber) {
      alert("No account number provided");
    } else if (accountNumber){
      // Fetch user details
      fetch(`/admin/user/${accountNumber}`)
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            const user = data.user;
            const form = document.getElementById("userForm");
            form.firstname.value = user.firstname;
            form.secondname.value = user.secondname;
            form.phonenumber.value = user.phonenumber;
            if (user.dob) {
              const date = new Date(user.dob);
              form.date_of_birth.value = date.toISOString().split("T")[0]; // "yyyy-MM-dd"
            } else {
              form.date_of_birth.value = "";
            }
            form.account_number.value = user.account_number;
            form.account_balance.value = user.account_balance;
            form.savings_balance.value = user.savings_balance;
            form.card_balance.value = user.card_balance;
            
          } else {
            alert("User not found: " + data.message);
          }
        })
        .catch(err => console.error("Error fetching user:", err));
    }

    // Handle form update
    document.getElementById("userForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const formData = Object.fromEntries(new FormData(e.target).entries());

      const res = await fetch(`/admin/user/${accountNumber}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(formData)
      });

      const data = await res.json();
      if (data.success) {
        alert("âœ… User updated successfully");
        window.location.href="manage_users.html"
      } else {
        alert("âŒ Error: " + data.message);
      }
    });
  </script>
</body>
</html>
